[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jol-analytics-ai"
version = "0.1.0"
description = "Analytics, ML & RAG Platform for Journey Of Life"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "apache-airflow>=2.8.0",
    "dbt-core>=1.7.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.5.0",
    "python-jose>=3.3.0",
    "cryptography>=42.0.0",
    "passlib>=1.7.4",
    # Pinned <4.1.0: passlib 1.7.4 calls bcrypt C-binding internals that changed
    # in bcrypt 4.1.0.  Lift only after migrating off passlib.
    "bcrypt>=4.0.0,<4.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0,<25",
    "ruff>=0.2.0",
    "mypy>=1.8.0,<3",
    "pre-commit>=3.6.0",
    "pandas-stubs>=2.0.0",
    "pip-audit>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803"]  # sklearn convention: X, y naming

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "sklearn.*",
    "sqlalchemy.*",
    "chromadb.*",
    "sentence_transformers.*",
    "joblib.*",
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
