version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "journeyoflife-org/backend"
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "bcrypt"
        versions: [">=4.1.0"]
      - dependency-name: "pathspec"
        versions: [">=0.13"]
      - dependency-name: "black"
        versions: [">=25"]
      - dependency-name: "mypy"
        versions: [">=2"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "journeyoflife-org/devops"
