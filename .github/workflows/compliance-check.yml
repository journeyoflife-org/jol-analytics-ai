name: Compliance Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/jol_analytics_ai/ml/**'
      - 'src/jol_analytics_ai/anonymization/**'
      - 'src/jol_analytics_ai/security/**'
      - 'src/jol_analytics_ai/rag/**'
      - 'model_cards/**'
      - 'compliance/**'

permissions:
  contents: read

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Check model cards exist for production models
        run: |
          python scripts/build-model-card.py --validate

      - name: Verify k-anonymity compliance
        run: |
          python scripts/verify-k-anonymity.py --check

      - name: Run PII audit
        run: |
          python scripts/run-pii-audit.py --ci-mode

      - name: Run security tests
        run: |
          pytest tests/security/ -v

      - name: Run fairness tests
        run: |
          pytest tests/fairness/ -v

      - name: Compliance report
        if: always()
        run: |
          echo "Compliance check completed"
          echo "Review results above for any failures"
